name: Build Horizon Launcher (Linux)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (GPUI/WGPU)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libvulkan-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-keysyms1-dev libxcb-icccm4-dev

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target

      - name: Compilar el Launcher (Perfil Release)
        # Cambiado de --profile fast a --release
        run: cargo build --release --bin horizon-launcher --manifest-path launcher/Cargo.toml
        env:
          WGPU_BACKEND: gl

      - name: Subir el binario compilado
        uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-linux-x86_64
          # La ruta cambia a la carpeta release
          path: launcher/target/release/horizon-launcher
          retention-days: 5
